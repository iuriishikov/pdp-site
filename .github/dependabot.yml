version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem cluster rather than a dozen: these move together
      # and are only meaningful when reviewed together.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      next:
        patterns: ['next', '@next/*']
      linting:
        patterns: ['eslint', 'eslint-*', '@eslint/*', 'typescript-eslint', 'prettier*']
      testing:
        patterns: ['vitest', '@vitest/*', '@playwright/*', 'playwright']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
